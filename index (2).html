<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype Sistem Aspirasi Forum Anak Kota Kendari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d2433; --muted:#5d6577; --line:#e3e1da;
  --brand:#0f766e; --brand-soft:#e3f2ef; --accent:#e8833a; --accent-soft:#fdeee2;
  --warn:#b45309; --warn-soft:#fef3c7; --danger:#b42318; --danger-soft:#fde8e6;
  --ok:#15803d; --ok-soft:#e5f5ea; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;letter-spacing:.5px}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.spacer{flex:1}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600;color:var(--ink)}
nav{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
.notice{background:var(--accent-soft);color:#7a3f12;font-size:12.5px;text-align:center;padding:6px 12px}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
.tile .n{font-size:28px;font-weight:700}
.tile .l{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#c9c6bc}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dan{color:var(--danger);border-color:#f2c1bc}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],select.in,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{resize:vertical;min-height:90px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
tr.click{cursor:pointer}tr.click:hover td{background:#faf9f6}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef0f3;color:#3b4252;white-space:nowrap}
.b-new{background:#e8eefc;color:#1e40af}.b-info{background:var(--warn-soft);color:var(--warn)}
.b-ver{background:var(--brand-soft);color:var(--brand)}.b-pantau{background:var(--accent-soft);color:#9a4a12}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-no{background:#eef0f3;color:#525a69}
.b-sens{background:var(--danger-soft);color:var(--danger)}
.muted{color:var(--muted)}.small{font-size:14px}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.alert.warn{background:var(--warn-soft);color:#78350f}.alert.info{background:var(--brand-soft);color:#134e4a}.alert.dan{background:var(--danger-soft);color:#7a1a12}
.bar{height:8px;border-radius:99px;background:#eceae4;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.kl-row{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:8px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:0 0 12px 18px;border-left:2px solid var(--line);position:relative;margin-left:5px}
.timeline li:before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.sec{margin-top:16px}
.lock{padding:30px;text-align:center;color:var(--muted)}
/* chat */
.chat{max-width:720px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:560px}
.chat-head{background:var(--brand);color:#fff;padding:14px 18px;border-radius:var(--radius) var(--radius) 0 0}
.chat-head b{display:block}
.chat-body{flex:1;overflow-y:auto;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;font-size:15.5px}
.msg.bot{background:#f0efe9;align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.me img{width:120px;height:120px;object-fit:cover;border-radius:8px;margin-top:6px;margin-right:6px}
.chat-foot{background:#fff;border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:12px}
.chat-foot textarea{min-height:150px;font-size:13.5px}
.tiny{font-size:13px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,33,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:60}
.toast.on{display:block}
.ai-tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:860px){.filters{grid-template-columns:1fr 1fr}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.lap-tiles .tile{border:1px solid var(--line);border-radius:10px;padding:12px}
.kop{border-bottom:2px solid var(--brand);padding-bottom:12px}
.lap-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.lap-item .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.lap-item .kv{grid-template-columns:150px 1fr;margin-top:8px}
.lap-item .thumbs img{width:120px;height:90px}
@media print{
 @page{size:A4;margin:16mm}
 body{background:#fff;font-size:12px}
 header,.notice,.no-print,.toast,.modal-bg{display:none!important}
 main{padding:0;max-width:none}
 #laporan{border:0;padding:0}
 table{page-break-inside:auto} tr{page-break-inside:avoid}
 h2{page-break-after:avoid;font-size:14px}
 th,td{font-size:11px;padding:5px 6px}
 .small{font-size:10.5px}.tiny{font-size:10px}
 .badge{border:1px solid #ccc}
 .lap-tiles{display:grid;grid-template-columns:repeat(4,1fr)}
 .lap-item{page-break-inside:avoid;break-inside:avoid}
 .lap-item .thumbs img{width:110px;height:82px}
}
.textbox{background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="logo"><div class="mark">FAK</div><div>Aspirasi Fantari<small>Forum Anak Kota Kendari</small></div></div>
    <div class="spacer"></div>

      <select id="roleSel">

</header>
<div class="notice">Prototype uji coba: semua data adalah contoh fiktif, dan fitur AI masih disimulasikan dengan aturan kata kunci (bukan model asli).</div>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

/* ---------- parsing template ---------- */
function parseTemplate(text){
 const map=[['nama','nama'],['asal','sekolah'],['kecamatan','kecamatan'],['kontak','kontak'],['ceritakan','masalah'],['masalah','masalah'],['usulan','usulan']];
 const out={nama:'',sekolah:'',kecamatan:'',kontak:'',masalah:'',usulan:''};let cur=null,found=0;
 text.split(/\r?\n/).forEach(line=>{
  const m=line.match(/^\s*([^:]{2,45}):\s*(.*)$/);
  if(m){const key=m[1].toLowerCase();const hit=map.find(([p])=>key.startsWith(p));if(hit){cur=hit[1];found++;out[cur]=(m[2]||'').trim();return}}
  if(cur&&line.trim())out[cur]+=(out[cur]?' ':'')+line.trim();
 });
 const kec=KEC.find(k=>out.kecamatan&&out.kecamatan.toLowerCase().includes(k.toLowerCase()));
 if(kec)out.kecamatan=kec;
 const ok=found>=4&&out.masalah.length>0;
 return {data:out,ok,kecValid:!!kec};
}

/* ---------- AI simulation ---------- */
function classify(it){
 const t=(it.masalah+' '+it.usulan).toLowerCase();
 const res=KLASTER.map(k=>{const hits=k.kw.filter(w=>t.includes(w));const h=[...(it.id+k.id)].reduce((a,c)=>a+c.charCodeAt(0),0)%5;return {k:k.id,score:Math.min(0.91,0.16+0.15*hits.length+h/100),hits}}).sort((a,b)=>b.score-a.score);
 const perluCek=res[0].score<0.4||(res[0].score-res[1].score)<0.06;
 return {top:res.slice(0,3),perluCek,waktu:today()};
}
function aiRingkas(it){
 const m=firstSent(it.masalah),u=firstSent(it.usulan);
 return u?`Masalah: ${endP(cap(m))}\nUsulan: ${endP(cap(u))}`:`Masalah: ${endP(cap(m))}`;
}
function baku(t){
 // simulasi sederhana: mengganti kata tidak baku yang umum, tanpa mengubah isi
 const map=[[/^\s*(kak|kakak|bang)\s*,?\s*/i,''],[/\b(ga|gak|nggak|ngga|enggak)\b/gi,'tidak'],[/\baja\b/gi,'saja'],[/\bbiar\b/gi,'agar'],[/\budah\b/gi,'sudah'],[/\bbanget\b/gi,'sekali'],[/\bpengen\b/gi,'ingin'],[/\bcuma\b/gi,'hanya'],[/\bkalo\b/gi,'kalau'],[/\bhp\b/gi,'HP'],[/\bgimana\b/gi,'bagaimana'],[/\btrus\b/gi,'lalu'],[/\bmain\b/gi,'bermain']];
 let s=t;map.forEach(([r,v])=>s=s.replace(r,v));return s.replace(/\s+/g,' ').trim();
}
function aiRapikan(it){
 const lok=it.kecamatan?`Kecamatan ${it.kecamatan}`:'Kota Kendari';
 let s=`Ayah Bunda yang kami hormati, kami anak-anak dari ${lok} ingin menyampaikan aspirasi.\n\n${endP(cap(baku(it.masalah)))}`;

 s+=`\n\nTerima kasih, Ayah Bunda, sudah mendengarkan suara kami.`;
 return s;
}

function readImages(files){
 // Re-encode via canvas: removes EXIF metadata (including GPS location)
 return Promise.all([...files].slice(0,4).map(f=>new Promise(res=>{
  if(!/^image\/(jpeg|png)$/.test(f.type)||f.size>8e6){res(null);return}
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1024/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.82))};img.onerror=()=>res(null);img.src=r.result};r.readAsDataURL(f);
 }))).then(a=>a.filter(Boolean));
}

 <div class="card sec"><h2>Template pesan</h2><div class="row">

 <div class="card sec"><h2>Riwayat status</h2><ul class="timeline">${it.riwayat.slice().reverse().map(r=>`<li><b>${esc(r.s)}</b> · ${fmt(r.t)} · <span class="muted">${esc(r.oleh)}</span>${r.c?`<div class="small">${esc(r.c)}</div>`:''}</li>`).join('')}</ul></div>`;

 if(!lapTahun||!years.includes(lapTahun))lapTahun=years[0]||today().slice(0,4);
 const yr=lapTahun;
 const all=state.items.filter(i=>i.dibuat.startsWith(yr)&&i.status!=='Diarsipkan');
 const sens=all.filter(i=>i.sensitif);
 const act=all.filter(i=>!i.sensitif);
 const cnt=s=>act.filter(i=>s.includes(i.status)).length;
 const disampaikan=act.filter(i=>i.penyampaian.length).length;
 const prior=act.filter(i=>i.prioritas);
 const keg=state.kegiatan.filter(k=>k.tanggal.startsWith(yr)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));

 const ringkas=i=>esc(firstSent((i.final||'').replace(/^Ayah Bunda[^.]*\.\s*/,''))||firstSent(i.masalah));
 const lastInfo=i=>{const t=i.tindakLanjut.at(-1),f=(i.followup||[]).at(-1);if(t&&(!f||t.tanggal>=f.tanggal))return `${fmt(t.tanggal)}: ${esc(t.info)}`;if(f)return `${fmt(f.tanggal)}: ditanyakan ke ${esc(f.pihak)}, menunggu jawaban`;return '<span class="muted">Belum ada informasi</span>'};
 const catatan=(state.lapCatatan||{})[yr]||'';
 const isAdmin=role==='admin';
 return `<div class="no-print">

  <p class="tiny sec">Pratinjau laporan:</p>
 </div>

  ${lapDetail!=='tidak'?(()=>{const VER=['Diterima','Perlu Informasi'];const det=act.filter(i=>!VER.includes(i.status)&&(lapDetail==='semua'||i.prioritas)).sort((a,b)=>((a.klaster||9)-(b.klaster||9))||a.dibuat.localeCompare(b.dibuat));

    return `<div class="lap-item"><div class="hd"><div><b>${n+1}. ${ringkas(i)}</b><div class="small muted">${i.id} · ${kl?esc(kl.nama+' — '+kl.judul):'Klaster belum dikonfirmasi'}</div></div>${badge(i.status)}</div>

     ${i.usulan&&!i.final?`<dt>Usulan anak</dt><dd>${esc(i.usulan)}</dd>`:''}
     <dt>Disampaikan</dt><dd>${pen.length?pen.map(p=>`${esc(p.tingkat)}, ${fmt(p.tanggal)}${p.pihak?` · follow up ke ${esc(p.pihak)}`:''}`).join('<br>'):'<span class="muted">Belum disampaikan</span>'}</dd>
     <dt>Tindak lanjut</dt><dd>${tl.length?tl.map(t=>`${fmt(t.tanggal)}: ${esc(t.info)}`).join('<br>'):lastInfo(i)}</dd>

    ${fotoOk(i.foto)?`<div class="small muted" style="margin-top:8px">Foto dari aspirasi:</div><div class="thumbs">${i.foto.slice(0,3).map(f=>`<img src="${f}" alt="foto aspirasi">`).join('')}</div>`:''}
    ${fotoOk(fBukti)?`<div class="small muted" style="margin-top:8px">Foto bukti tindak lanjut:</div><div class="thumbs">${fBukti.slice(0,3).map(f=>`<img src="${f}" alt="foto bukti">`).join('')}</div>`:''}

function tplFollowText(it,pihak){
 const p=it.penyampaian.at(-1);
 const ring=it.final?firstSent(it.final.replace(/^Ayah Bunda[^.]*\.\s*/,'')):firstSent(it.masalah);
 const dp3a=pihak.startsWith('DP3A');
 const nama=(role==='anak'?'[nama pengurus]':roleLabel().replace(/\s*\(.*\)/,''));
 let s=`Assalamualaikum / Selamat pagi, Ayah Bunda di ${pihak}.\n\nKami dari Forum Anak Kota Kendari ingin menanyakan perkembangan aspirasi anak yang kami sampaikan pada ${p?`${p.tingkat} (${p.lokasi}), ${fmt(p.tanggal)}`:'Musrenbang'}:\n• Aspirasi: ${ring}\n• Kecamatan: ${it.kecamatan}`;
 if(dp3a&&p&&p.instansi)s+=`\n\nAspirasi ini berkaitan dengan ${p.instansi}. Mohon bantuan Ayah Bunda untuk menanyakan perkembangannya kepada pihak terkait.`;
 s+=`\n\nApakah sudah ada informasi tindak lanjutnya? Jika ada dokumentasi, kami sangat berterima kasih bila Ayah Bunda berkenan membagikannya.\n\nTerima kasih atas perhatian Ayah Bunda.\nSalam,\n${nama}\nForum Anak Kota Kendari`;
 return s;
}
function tplFollowModal(it){
 const opts=pihakOpts(it.penyampaian.at(-1).tingkat,it.kecamatan),cur=pihakNow(it);
 modal(`<h2>Tanya perkembangan ${esc(it.id)}</h2><p class="small muted">Salin, lalu kirim lewat WhatsApp atau email. Setelah itu klik <b>Catat sudah ditanyakan</b> supaya pengingat diperbarui dan pengurus lain tahu.</p>
 <label class="f">Ditujukan ke</label><select class="in" id="tplPihak" data-id="${it.id}">${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>
 <textarea id="tplText" style="min-height:260px;margin-top:10px">${esc(tplFollowText(it,opts.includes(cur)?cur:opts[0]))}</textarea>
 <div class="row" style="margin-top:10px"><button class="btn pri" data-action="copyTpl">Salin pesan</button>${role!=='fasilitator'?`<button class="btn" data-action="logAskQuick" data-id="${it.id}">Catat sudah ditanyakan hari ini</button>`:''}<button class="btn" data-action="close">Tutup</button></div>`);
}
function tplInfo(it){
 const nm=(it.nama||'').replace(/\s*\(contoh\)/,'')||'teman';
 return `Halo ${nm}, terima kasih sudah menyampaikan aspirasimu ke Forum Anak Kota Kendari 😊\n\nSupaya aspirasimu (nomor ${it.id}) bisa kami sampaikan dengan jelas, boleh kami tahu lebih lanjut tentang:\n- [hal yang perlu dilengkapi, mis. lokasi persisnya atau sejak kapan terjadi]\n\nSalam,\n[nama pengurus]\nForum Anak Kota Kendari`;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 const a=el.dataset.action, id=el.dataset.id, it=id?get(id):null;
 if(el.tagName==='A')e.preventDefault();
 switch(a){
  case 'go':view=el.dataset.view;detailId=null;render();window.scrollTo(0,0);break;
  case 'open':view='detail';detailId=id;render();window.scrollTo(0,0);break;
  case 'susunInput':{const m=$('#iMasalah').value.trim();if(!m){toast('Tulis cerita anak dulu');break}
   $('#iDraf').value=aiRapikan({masalah:m,usulan:$('#iUsulan').value.trim(),kecamatan:$('#iKec').value});toast('Draf disusun. Periksa apakah masih sesuai maksud anak.');break}
  case 'openKeg':view='kegiatanDetail';kegId=id;render();window.scrollTo(0,0);break;
  case 'reset':modal(`<h2>Reset data contoh?</h2><p>Semua aspirasi yang kamu tambahkan akan hilang dan data kembali ke contoh awal.</p><div class="row"><button class="btn dan" data-action="doReset">Ya, reset</button><button class="btn" data-action="close">Batal</button></div>`);break;
  case 'doReset':state=seed();save();chatLog=[];closeModal();view=NAV[role][0][0];render();toast('Data dikembalikan ke contoh awal');break;
  case 'close':closeModal();break;
  case 'classify':it.klasterAI=classify(it);addHist(it,it.status,'Klasifikasi AI dijalankan (rekomendasi: '+KLASTER.find(k=>k.id===it.klasterAI.top[0].k).nama+').');save();render();break;
  case 'setKl':{const v=Number($('#klSel').value);if(!v){toast('Pilih klaster dulu');break}it.klaster=v;addHist(it,it.status,'Klaster dikonfirmasi: '+klName(v));save();render();toast('Klaster disimpan');break}
  case 'ringkas':it.ringkas=aiRingkas(it);it.rapikan='';save();render();break;
  case 'rapikan':it.rapikan=aiRapikan(it);save();render();break;
  case 'setFinal':{const v=$('#aiOut').value.trim();if(!v){toast('Belum ada teks');break}it.final=v;addHist(it,it.status,'Versi final untuk Musrenbang disetujui.');save();render();toast('Versi final disimpan');break}
  case 'verify':if(it.inputOleh===acct){toast('Tidak bisa memverifikasi aspirasi yang kamu input sendiri');break}if(!it.klaster){toast('Konfirmasi klaster dulu sebelum verifikasi');break}it.status='Terverifikasi';addHist(it,'Terverifikasi','');
   if(it.penyampaian.length){it.status='Disampaikan';addHist(it,'Disampaikan','Sudah disampaikan sebelumnya ('+it.penyampaian.at(-1).tingkat+'); pemantauan dimulai.')}save();render();break;
  case 'needInfo':it.status='Perlu Informasi';addHist(it,'Perlu Informasi','');save();render();if(it.kontak)tplModal('Minta informasi tambahan',tplInfo(it),'Kirim lewat WhatsApp ke '+esc(it.kontak)+'.');break;
  case 'archive':modal(`<h2>Arsipkan ${it.id}</h2><label class="f">Alasan</label><select class="in" id="arR"><option>Duplikat</option><option>Digabung dengan aspirasi lain</option><option>Tidak relevan</option></select><div class="row" style="margin-top:12px"><button class="btn dan" data-action="doArchive" data-id="${it.id}">Arsipkan</button><button class="btn" data-action="close">Batal</button></div>`);break;
  case 'doArchive':it.status='Diarsipkan';addHist(it,'Diarsipkan',$('#arR').value);save();closeModal();render();break;
  case 'printLap':try{window.print()}catch(err){toast('Cetak tidak tersedia di sini. Buka versi GitHub Pages.')}break;
  case 'saveCat':state.lapCatatan=state.lapCatatan||{};state.lapCatatan[lapTahun]=$('#lapCat').value;save();render();toast('Catatan pengantar disimpan');break;
  case 'togglePrior':it.prioritas=!it.prioritas;addHist(it,it.status,it.prioritas?'Ditandai sebagai aspirasi prioritas.':'Tidak lagi menjadi aspirasi prioritas.');save();render();break;
  case 'mode':mode=el.dataset.m;setRole();view=NAV[role][0][0];detailId=null;render();toast(mode==='admin'?'Mode Admin: mengelola dan memverifikasi':'Mode Pengurus: input, follow-up, dan Musrenbang');break;
  case 'askSens':modal(`<h2>Tandai ${it.id} sebagai sensitif?</h2><p>Gunakan kalau aspirasi berisi indikasi kekerasan, eksploitasi, atau ancaman terhadap anak.</p>
   <div class="alert dan">Jangan ceritakan isi aspirasi ini ke orang lain. Fasilitator akan menindaklanjuti bersama pihak yang berwenang.</div>
   ${role==='pengurus'?'<p class="small muted">Setelah ditandai, isinya hanya bisa dibuka Admin dan Fasilitator, termasuk tidak bisa kamu buka lagi.</p>':''}
   <div class="row"><button class="btn dan" data-action="doSens" data-id="${it.id}">Ya, tandai sensitif</button><button class="btn" data-action="close">Batal</button></div>`);break;
  case 'doSens':it.sensitif=true;it.sensitifOleh=acct;it.sensitifTgl=today();addHist(it,it.status,'Ditandai sensitif. Akses dibatasi, fasilitator diberi notifikasi.');save();closeModal();render();toast('Ditandai sensitif. Fasilitator sudah diberi tahu.');break;
  case 'unSens':it.sensitif=false;addHist(it,it.status,'Tanda sensitif dihapus.');save();render();break;
  case 'addPenyampaian':{const tg=$('#pTg').value;if(!tg){toast('Isi tanggal');break}it.penyampaian.push({tingkat:$('#pTk').value,tanggal:tg,lokasi:$('#pLk').value,penyampai:roleLabel(),peran:$('#pPr').value,catatan:$('#pCt').value,pihak:$('#pPh').value,instansi:$('#pIn').value.trim()});if(it.status==='Terverifikasi'){it.status='Disampaikan';addHist(it,'Disampaikan',$('#pTk').value+'.')}else addHist(it,it.status,'Disampaikan lagi di '+$('#pTk').value+'.');save();render();toast('Penyampaian dicatat. Pengingat dihitung 30 hari dari tanggal ini.');break}
  case 'setJenis':it.jenisTL=$('#jenisSel').value;save();render();toast('Jenis tindak lanjut disimpan');break;
  case 'addTL':{const st=$('#tSt').value,info=$('#tIn').value.trim(),bk=$('#tBk').value.trim();if(!info){toast('Isi informasi tindak lanjut');break}
   if(st==='Terlaksana'&&!bk){toast('Status Terlaksana wajib disertai keterangan bukti');break}
   if(st==='Terlaksana'&&!it.jenisTL){toast('Pilih jenis tindak lanjut dulu');break}
   const foto=await readImages($('#tFt').files);it.tindakLanjut.push({tanggal:$('#tTg').value||today(),info,bukti:bk,foto});
   if(it.status!==st){it.status=st;addHist(it,st,info)}else addHist(it,st,'Update: '+info);save();render();toast('Tindak lanjut dicatat');break}
  case 'addFas':{const v=$('#fasIn').value.trim();if(!v)break;it.catatanFasil.push({t:today(),c:v});save();render();break}
  case 'tplFollow':tplFollowModal(it);break;
  case 'claim':it.pj=roleLabel();addHist(it,it.status,'Penanggung jawab follow-up: '+it.pj);save();render();toast('Tugas follow-up diambil');break;
  case 'logAsk':{it.followup.push({tanggal:$('#fTg').value||today(),pihak:$('#fPh').value,oleh:roleLabel(),catatan:$('#fCt').value.trim()});if(!it.pj)it.pj=roleLabel();save();render();toast('Tercatat. Pengingat berikutnya 30 hari lagi.');break}
  case 'logAskQuick':{const ph=$('#tplPihak').value;it.followup.push({tanggal:today(),pihak:ph,oleh:roleLabel(),catatan:''});if(!it.pj)it.pj=roleLabel();save();closeModal();render();toast('Tercatat sudah ditanyakan ke '+ph);break}
  case 'tplInfo':tplModal('Minta informasi tambahan',tplInfo(it),'Kirim lewat WhatsApp ke '+esc(it.kontak)+'.');break;
  case 'copyTpl':copyText($('#tplText'));break;
  case 'edit':modal(`<h2>Edit data ${it.id}</h2>
   <div class="grid g2"><div><label class="f">Nama</label><input type="text" id="eNama" value="${esc(it.nama)}"></div><div><label class="f">Asal sekolah / kelurahan</label><input type="text" id="eSek" value="${esc(it.sekolah)}"></div>
   <div><label class="f">Kecamatan</label><select class="in" id="eKec"><option value="">Pilih…</option>${KEC.map(k=>`<option ${it.kecamatan===k?'selected':''}>${k}</option>`).join('')}</select></div><div><label class="f">Kontak</label><input type="text" id="eKon" value="${esc(it.kontak)}"></div></div>
   <label class="f">Masalah</label><textarea id="eMas">${esc(it.masalah)}</textarea><label class="f">Usulan</label><textarea id="eUsu" style="min-height:60px">${esc(it.usulan)}</textarea>
   ${it.teksAsli?`<details><summary class="small">Pesan asli</summary><div class="textbox">${esc(it.teksAsli)}</div></details>`:''}
   <div class="row" style="margin-top:12px"><button class="btn pri" data-action="doEdit" data-id="${it.id}">Simpan</button><button class="btn" data-action="close">Batal</button></div>`);break;
  case 'doEdit':Object.assign(it,{nama:$('#eNama').value,sekolah:$('#eSek').value,kecamatan:$('#eKec').value,kontak:$('#eKon').value,masalah:$('#eMas').value,usulan:$('#eUsu').value});if(it.kecamatan&&it.masalah)it.perluRapikan=false;addHist(it,it.status,'Data dirapikan.');save();closeModal();render();break;
  case 'copyCsv':{let csv;const act=state.items.filter(i=>i.status!=='Diarsipkan');
   if(el.dataset.which==='kec'){csv='Kecamatan,Diperiksa,Dipantau,Terlaksana,Belum dapat,Total\n'+KEC.map(k=>{const its=act.filter(i=>i.kecamatan===k);if(!its.length)return null;const c=s=>its.filter(i=>s.includes(i.status)).length;return [k,c(['Diterima','Perlu Informasi','Terverifikasi']),c(PANTAU),c(['Terlaksana']),c(['Belum Dapat Ditindaklanjuti']),its.length].join(',')}).filter(Boolean).join('\n')}
   else{csv='Klaster,Judul,Aspirasi,Terlaksana\n'+KLASTER.map(k=>[k.nama,'"'+k.judul+'"',act.filter(i=>i.klaster===k.id).length,act.filter(i=>i.klaster===k.id&&i.status==='Terlaksana').length].join(',')).join('\n')}
   modal(`<h2>CSV laporan</h2><textarea id="tplText" style="min-height:200px;font-family:monospace">${esc(csv)}</textarea><div class="row" style="margin-top:10px"><button class="btn pri" data-action="copyTpl">Salin</button><button class="btn" data-action="close">Tutup</button></div>`);break}
 }
});
function copyText(ta){
 try{navigator.clipboard.writeText(ta.value).then(()=>toast('Disalin ke clipboard')).catch(()=>{ta.select();toast('Teks sudah dipilih, tekan Ctrl/Cmd+C')})}catch(err){ta.select();toast('Teks sudah dipilih, tekan Ctrl/Cmd+C')}
}
document.addEventListener('submit',async e=>{
 if(e.target.id==='chatForm')return handleChatSubmit(e);
 if(e.target.id==='kegForm'){e.preventDefault();
  const nama=$('#kNama').value.trim(),tg=$('#kTg').value,jenis=$('#kJenis').value,kec=$('#kKec').value;
  if(!nama||!tg){toast('Nama dan tanggal kegiatan wajib diisi');return}
  if(jenis==='Musrenbang Kecamatan'&&!kec){toast('Pilih kecamatan untuk Musrenbang Kecamatan');return}
  const foto=await readImages($('#kFoto').files);const dok=[...$('#kDok').files].map(f=>({nama:f.name}));
  const ids=[...document.querySelectorAll('.kAsp:checked')].map(c=>c.value);
  const id='KEG-'+String(++state.kseq).padStart(3,'0');
  state.kegiatan.push({id,nama,jenis,tanggal:tg,kecamatan:kec,lokasi:$('#kLok').value,peserta:$('#kPes').value,catatan:$('#kCt').value,izin:$('#kIzin').value,foto,dokumen:dok,aspirasi:ids,oleh:roleLabel()});
  let n=0;
  if($('#kAuto').checked&&TINGKAT.includes(jenis)){ids.map(get).forEach(it=>{if(!it||['Diarsipkan','Terlaksana','Belum Dapat Ditindaklanjuti'].includes(it.status))return;
   it.penyampaian.push({tingkat:jenis,tanggal:tg,lokasi:jenis==='Musrenbang Kecamatan'?'Kecamatan '+kec:($('#kLok').value||'Kota Kendari'),penyampai:roleLabel(),peran:'Menyampaikan langsung',catatan:'Dicatat dari kegiatan '+id,pihak:pihakOpts(jenis,it.kecamatan)[0],instansi:''});
   if(it.status==='Terverifikasi'){it.status='Disampaikan';addHist(it,'Disampaikan',jenis+' ('+id+').')}else addHist(it,it.status,'Penyampaian dicatat: '+jenis+' ('+id+')'+(['Diterima','Perlu Informasi'].includes(it.status)?'. Status menjadi Disampaikan setelah diverifikasi Admin.':'.'));n++})}
  save();view='kegiatanDetail';kegId=id;render();toast(id+' tersimpan'+(n?`, ${n} penyampaian ikut dicatat`:''));return;
 }
 if(e.target.id==='inForm'){e.preventDefault();
  const kec=$('#iKec').value,mas=$('#iMasalah').value.trim();if(!kec||!mas){toast('Kecamatan dan masalah wajib diisi');return}
  const foto=await readImages($('#iFoto').files);
  const id='ASP-'+String(++state.seq).padStart(3,'0');
  const draf=$('#iDraf').value.trim(),fin=$('#iFinal').checked&&draf;
  const it={id,sumber:'pengurus',inputOleh:acct,asal:$('#iAsal').value,nama:$('#iNama').value,sekolah:$('#iKel').value,kecamatan:kec,kontak:$('#iKontak').value,masalah:mas,usulan:$('#iUsulan').value.trim(),foto,klasterAI:null,klaster:null,ringkas:'',rapikan:draf,final:fin?draf:'',sensitif:false,perluRapikan:false,jenisTL:'',penyampaian:[],tindakLanjut:[],catatanFasil:[],followup:[],pj:'',dibuat:today(),status:'Diterima',riwayat:[{t:today(),s:'Diterima',oleh:roleLabel(),c:'Diinput pengurus.'+(fin?' Versi final disusun dengan bantuan AI dan sudah diperiksa.':'')}]};
  if($('#iSudah').checked){const sal=$('#iSal').value,kg=$('#iKeg').value;
   it.penyampaian.push({tingkat:sal,tanggal:$('#iTgS').value||today(),lokasi:sal==='Musrenbang Kecamatan'?'Kecamatan '+kec:'Kota Kendari',penyampai:roleLabel(),peran:'Menyampaikan langsung',catatan:kg?'Kegiatan '+kg:'',pihak:pihakOpts(sal,kec)[0],instansi:''});
   it.riwayat.push({t:today(),s:'Diterima',oleh:roleLabel(),c:'Sudah disampaikan lewat '+sal+'. Menunggu verifikasi Admin.'});
   if(kg){const k=state.kegiatan.find(x=>x.id===kg);if(k&&!k.aspirasi.includes(id))k.aspirasi.push(id)}}
  state.items.push(it);
  save();view='detail';detailId=id;render();toast(id+' tersimpan. Menunggu verifikasi Admin.');
 }
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='roleSel'){acct=t.value;mode='admin';setRole();view=NAV[role][0][0];detailId=null;render();return}
 if(t.id==='lapYr'){lapTahun=t.value;render();return}
 if(t.id==='lapDet'){lapDetail=t.value;render();return}
 if(t.id==='lapFt'){lapFoto=t.checked;render();return}
 if(t.id==='pTk'){const it=get(detailId);$('#pPh').innerHTML=pihakOpts(t.value,it&&it.kecamatan).map(o=>`<option>${esc(o)}</option>`).join('');if(t.value==='Musrenbang Kota')$('#pLk').value='Kota Kendari';return}
 if(t.id==='tplPihak'){const it=get(t.dataset.id);$('#tplText').value=tplFollowText(it,t.value);return}
 if(t.id==='chatFoto'){const imgs=await readImages(t.files);draftFoto=draftFoto.concat(imgs).slice(0,4);const box=$('#draftThumbs');if(box)box.innerHTML=draftFoto.map(f=>`<img src="${f}" alt="foto">`).join('');if(imgs.length<t.files.length)toast('Hanya JPG/PNG di bawah 8 MB, maksimal 4 foto');return}
 if(['fkec','fkl','fst'].includes(t.id)){flt.kec=$('#fkec').value;flt.kl=$('#fkl').value;flt.st=$('#fst').value;render()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='fq'){flt.q=e.target.value;const pos=e.target.selectionStart;render();const f=$('#fq');f.focus();f.setSelectionRange(pos,pos)}
});
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});

render();
})();
</script>
